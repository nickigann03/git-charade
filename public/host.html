<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host | Charades Showdown</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: var(--white); }
  </style>
</head>
<body>
  <div class="host-container">
    
    <!-- AUTH VIEW -->
    <div id="view-auth" class="view active" style="flex-direction: row;">
      <div class="card" style="width: 400px; text-align: center;">
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">Host Login</h1>
        <input type="password" id="host-pin" class="input" placeholder="Enter PIN" style="text-align: center;">
        <button id="btn-login" class="btn btn-ink" style="width: 100%; margin-top: 1rem; background: var(--ink); color: var(--white);">Login</button>
      </div>
    </div>

    <!-- LOBBY VIEW -->
    <div id="view-lobby" class="view">
      <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 2rem;">
        <h1 style="font-size: 3rem;">Charades <span class="text-gold">Showdown</span></h1>
        <div style="display: flex; gap: 1rem;">
          <button id="btn-settings" class="btn btn-white">Settings</button>
          <button id="btn-start-game" class="btn btn-green" disabled>Start Game</button>
        </div>
      </div>
      
      <div class="host-lobby">
        <div class="qr-section">
          <img src="/qr.png" alt="QR Code">
          <h2 style="margin-top: 1.5rem; font-size: 2rem;">Join the Game</h2>
          <p id="join-url" style="font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;" class="text-blue">Scan to join</p>
          <p id="disconnected-warning" style="color: var(--red); font-weight: 800; display: none; margin-top: 1rem;">DISCONNECTED! Trying to reconnect...</p>
        </div>
        
        <div class="teams-section">
          <div class="team-list red">
            <h2 class="text-red" style="font-size: 2rem; display: flex; justify-content: space-between; align-items: center;">
              Team Red <span id="count-red">0</span>
            </h2>
            <div id="list-red" style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1; overflow-y: auto;"></div>
          </div>
          
          <div style="display: flex; flex-direction: column; justify-content: center; gap: 1rem;">
            <button id="btn-shuffle" class="btn btn-white" style="font-size: 1rem; padding: 0.75rem 1rem;">Shuffle<br>Teams</button>
            <button id="btn-clear" class="btn btn-white" style="font-size: 1rem; padding: 0.75rem 1rem;">Clear<br>Players</button>
          </div>
          
          <div class="team-list blue">
            <h2 class="text-blue" style="font-size: 2rem; display: flex; justify-content: space-between; align-items: center;">
              Team Blue <span id="count-blue">0</span>
            </h2>
            <div id="list-blue" style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1; overflow-y: auto;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- READY / PLAYING VIEW -->
    <div id="view-playing" class="view" style="padding: 0;">
      <div class="host-scoreboard">
        <div id="score-red" class="score-panel red">
          <div style="font-size: 2rem; font-weight: 800; text-transform: uppercase;">Team Red</div>
          <div id="score-val-red">0</div>
        </div>
        
        <div class="center-panel">
          <div id="host-timer" class="timer">60</div>
          
          <div class="card" style="width: 100%; border: none; box-shadow: none;">
            <h3 id="current-actor-name" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Player Name</h3>
            <p id="current-actor-team" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;" class="text-red">Team Red</p>
            <div id="turn-correct-count" style="font-size: 3rem; font-weight: 800;" class="text-green">0 Correct</div>
          </div>
          
          <div id="host-controls" style="display: flex; gap: 1rem; margin-top: auto;">
            <button id="btn-end-turn" class="btn btn-white">End Turn Now</button>
            <button id="btn-skip-actor" class="btn btn-white">Skip Actor</button>
            <button id="btn-end-game" class="btn btn-white text-red" style="border-color: var(--red);">End Game</button>
          </div>
        </div>
        
        <div id="score-blue" class="score-panel blue">
          <div style="font-size: 2rem; font-weight: 800; text-transform: uppercase;">Team Blue</div>
          <div id="score-val-blue">0</div>
        </div>
      </div>
    </div>
    
    <!-- OVER VIEW -->
    <div id="view-over" class="view">
      <h1 id="over-winner" style="font-size: 6rem; margin-bottom: 2rem;">Team Red Wins!</h1>
      <div style="display: flex; gap: 4rem; font-size: 4rem; font-weight: 800;">
        <div class="text-red">Red: <span id="final-score-red">0</span></div>
        <div class="text-blue">Blue: <span id="final-score-blue">0</span></div>
      </div>
      <div style="display: flex; gap: 2rem; margin-top: 4rem;">
        <button id="btn-play-again" class="btn btn-gold" style="font-size: 2rem;">Play Again (Same Teams)</button>
        <button id="btn-new-game" class="btn btn-white" style="font-size: 2rem;">New Game (Clear Players)</button>
      </div>
    </div>

  </div>

  <!-- Settings Modal -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal-content">
      <h2 style="font-size: 2rem; margin-bottom: 1.5rem;">Game Settings</h2>
      
      <div class="settings-group">
        <label>Seconds per Turn</label>
        <input type="number" id="set-time" min="15" max="180" value="60">
      </div>
      
      <div class="settings-group">
        <label>Skips per Turn</label>
        <input type="number" id="set-skips" min="0" max="20" value="3">
      </div>
      
      <div class="settings-group" style="flex: 1;">
        <label>Word List (one per line)</label>
        <textarea id="set-words" rows="10"></textarea>
      </div>
      
      <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
        <button id="btn-cancel-settings" class="btn btn-white">Cancel</button>
        <button id="btn-save-settings" class="btn btn-green">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
